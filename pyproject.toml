[project]
name = "course_paper_1"
version = "0.1.0"
description = ""
authors = [
    {name = "Luybov",email = "kalina.lyuba2017@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["requests (>=2.32.5,<3.0.0)", "load-dotenv (>=0.1.0,<0.2.0)", "logging (>=0.4.9.6,<0.5.0.0)", "pandas (>=3.0.1,<4.0.0)", "openpyxl (>=3.1.5,<4.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0)"
]

[tool.flake8]
max-line-length = 119
exclude = ".git,__pycache__,.venv"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ['venv', 'tests']
